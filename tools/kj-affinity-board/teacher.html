<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KJ 法課堂工具 — 老師後台</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root {
  --bg: #fdf6ec; --card: #fff; --accent: #e08a3e; --accent-dark: #b96a24;
  --text: #3a2e22; --text-mid: #7a6a5a; --text-dim: #ab9c8c;
  --border: rgba(0,0,0,.10); --radius: 14px; --danger: #d96060; --ok: #4a9e78;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { min-height: 100%; background: var(--bg); font-family: 'Microsoft JhengHei', 'Noto Sans TC', sans-serif; color: var(--text); }
button, input, select, textarea { font-family: inherit; }
#header { background: linear-gradient(135deg, var(--accent), var(--accent-dark)); color: #fff; padding: 16px 20px; }
#header h1 { font-size: 1.15rem; }
.wrap { max-width: 760px; margin: 0 auto; padding: 18px 16px 60px; }
.card { background: var(--card); border-radius: var(--radius); box-shadow: 0 2px 12px rgba(0,0,0,.08); padding: 20px; margin-bottom: 16px; }
.card h2 { font-size: 1rem; margin-bottom: 14px; color: var(--text-mid); }
.field { margin-bottom: 14px; }
.field label { display: block; font-size: .82rem; font-weight: 600; color: var(--text-mid); margin-bottom: 6px; }
.field input, .field textarea, .field select { width: 100%; padding: 10px 12px; border: 1.5px solid var(--border); border-radius: 10px; font-size: .95rem; background: #fafafa; }
.field textarea { min-height: 100px; resize: vertical; }
.btn { display: inline-block; padding: 11px 20px; border: none; border-radius: 10px; background: var(--accent); color: #fff; font-weight: 700; cursor: pointer; font-size: .92rem; }
.btn:active { background: var(--accent-dark); }
.btn.secondary { background: #eee; color: var(--text); }
.btn:disabled { background: #ccc; cursor: not-allowed; }
.err { color: var(--danger); font-size: .82rem; margin-top: 8px; }
.hidden { display: none !important; }
.row { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
.row > * { flex: 1; min-width: 140px; }
#roomLink { font-size: .9rem; color: var(--accent-dark); word-break: break-all; }
#qrBox { background: #fff; padding: 8px; border-radius: 10px; display: inline-block; }
.joined-list { font-size: .85rem; }
.joined-list div { padding: 6px 0; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; }
.note-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: .88rem; }
.note-row .del { color: var(--danger); background: none; border: none; cursor: pointer; font-size: .8rem; }

.pool-box { background: rgba(0,0,0,.03); border-radius: 14px; padding: 12px; margin-bottom: 16px; min-height: 60px; }
.pool-title { font-size: .76rem; color: var(--text-dim); margin-bottom: 8px; }
.notes-wrap { display: flex; flex-wrap: wrap; gap: 10px; }
.columns { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.col { background: rgba(0,0,0,.03); border: 1.5px dashed var(--border); border-radius: 14px; padding: 10px; min-height: 90px; }
.col-title { font-size: .82rem; font-weight: 700; color: var(--text-mid); margin-bottom: 8px; }
.col-notes { display: flex; flex-direction: column; gap: 8px; min-height: 30px; }
.note { width: 128px; padding: 9px 9px 7px; border-radius: 3px 12px 4px 11px; cursor: pointer; position: relative; animation: pop .28s ease-out; }
.col .note { width: 100%; }
.note.selected { box-shadow: 0 0 0 3px var(--accent-dark); }
.note .n-name { font-size: .68rem; font-weight: 700; margin-bottom: 3px; opacity: .85; display: flex; justify-content: space-between; gap: 6px; }
.note .n-text { font-size: .82rem; line-height: 1.35; word-break: break-word; }
.note .n-del { border: none; background: none; color: inherit; opacity: .6; cursor: pointer; font-size: .78rem; padding: 0 2px; }
@keyframes pop { 0% { transform: scale(.7); opacity: 0; } 60% { transform: scale(1.06); opacity: 1; } 100% { transform: scale(1); } }
.cluster { border: 1.5px dashed var(--text-dim); border-radius: 12px; padding: 8px; display: flex; flex-direction: column; gap: 8px; background: rgba(255,255,255,.4); }
.cluster .cluster-notes { display: flex; flex-wrap: wrap; gap: 8px; }
.cluster .cluster-notes .note { width: 128px; }
.name-cat-btn { align-self: flex-start; border: none; background: var(--accent); color: #fff; font-size: .72rem; font-weight: 700; padding: 5px 10px; border-radius: 999px; cursor: pointer; }
.c0 { background: #fde7c5; } .c0 .n-name { color: #8a5a10; } .c0 .n-text { color: #5c3c08; }
.c1 { background: #cdeee0; } .c1 .n-name { color: #146850; } .c1 .n-text { color: #0c4636; }
.c2 { background: #f6cfe0; } .c2 .n-name { color: #9c2f5e; } .c2 .n-text { color: #6e2142; }
.c3 { background: #d6e4fb; } .c3 .n-name { color: #29579e; } .c3 .n-text { color: #1c3c6e; }
.c4 { background: #e3dbf9; } .c4 .n-name { color: #5c419e; } .c4 .n-text { color: #40306e; }
.badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: .74rem; background: var(--ok); color: #fff; }
.cat-chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 8px 5px 12px; border-radius: 999px; background: #f3ead9; font-size: .82rem; }
.cat-chip button { border: none; background: none; color: var(--text-dim); cursor: pointer; font-size: .9rem; line-height: 1; padding: 2px; }
.topic-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); }
.topic-row .topic-q { font-weight: 600; }
.topic-row .topic-meta { font-size: .76rem; color: var(--text-dim); margin-top: 2px; }
.topic-row .btn { padding: 7px 14px; font-size: .82rem; white-space: nowrap; }
</style>
</head>
<body>
<div id="header"><h1>KJ 法課堂工具 — 老師後台</h1></div>
<div class="wrap">

  <div class="card" id="loginCard">
    <h2>登入</h2>
    <button class="btn" id="loginBtn">使用 Google 登入</button>
    <div class="err" id="loginErr"></div>
  </div>

  <div class="card hidden" id="classCard">
    <h2>班級</h2>
    <div class="field">
      <label>選擇既有班級</label>
      <select id="classSelect"><option value="">— 新增班級 —</option></select>
    </div>
    <div class="field" id="newClassField">
      <label>新班級名稱</label>
      <input id="newClassName" placeholder="例如 三年一班">
    </div>
    <button class="btn" id="useClassBtn">使用這個班級</button>
    <div class="err" id="classErr"></div>
  </div>

  <div class="card hidden" id="rosterCard">
    <h2>班級名單（學號＋姓名，一行一位）</h2>
    <div class="field">
      <textarea id="rosterInput" placeholder="12,陳小安&#10;05,林小婷&#10;19,黃小宇"></textarea>
    </div>
    <button class="btn" id="saveRosterBtn">儲存名單</button>
    <span id="rosterCount" style="margin-left:10px;font-size:.82rem;color:var(--text-mid);"></span>
    <div class="err" id="rosterErr"></div>
  </div>

  <div class="card hidden" id="topicListCard">
    <h2>議題</h2>
    <div id="topicList" style="font-size:.9rem;"></div>
    <button class="btn secondary" id="newTopicToggleBtn" style="margin-top:12px;">＋ 開新議題</button>
  </div>

  <div class="card hidden" id="roomCard">
    <h2>開新議題</h2>
    <div class="field">
      <label>本次議題／問題</label>
      <input id="questionInput" placeholder="例如：我們社區怎麼設計會更友善？">
    </div>
    <div class="field">
      <label>每人最多發幾則（0＝不限）</label>
      <input id="maxNotesInput" type="number" min="0" value="3" style="max-width:160px;">
    </div>
    <p style="font-size:.8rem;color:var(--text-mid);margin-bottom:14px;">分類欄位不用現在設——等大家的便利貼收集得差不多了，再依實際內容新增分類（在下面「這個議題」那邊隨時可以加）。</p>
    <button class="btn" id="createRoomBtn">開始這個議題</button>
    <div class="err" id="roomErr"></div>
  </div>

  <div class="card hidden" id="activeRoomCard">
    <h2>這個議題 <span class="badge" id="activeBadge">進行中</span></h2>
    <p style="font-weight:700;margin-bottom:10px;" id="activeQuestion"></p>
    <div class="row" style="align-items:center;">
      <div>
        <div id="roomLink"></div>
        <div id="qrBox" style="margin-top:10px;"></div>
      </div>
    </div>
    <div style="margin-top:16px;border-top:1px solid var(--border);padding-top:14px;">
      <div style="font-size:.82rem;font-weight:600;color:var(--text-mid);margin-bottom:8px;">每人最多發幾則（0＝不限）</div>
      <div class="row" style="align-items:center;">
        <input id="editMaxNotesInput" type="number" min="0" style="flex:1;max-width:100px;padding:10px 12px;border:1.5px solid var(--border);border-radius:10px;font-size:.95rem;background:#fafafa;">
        <button class="btn secondary" id="saveMaxNotesBtn" style="flex:1;">更新（馬上生效）</button>
      </div>
      <div class="err" id="maxNotesErr"></div>
    </div>
    <div style="margin-top:16px;border-top:1px solid var(--border);padding-top:14px;">
      <div style="font-size:.82rem;font-weight:600;color:var(--text-mid);margin-bottom:8px;">分類欄位</div>
      <div id="catList" style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;"></div>
      <div class="row">
        <input id="newCatInput" placeholder="新增分類，例如：溝通" style="flex:2;padding:10px 12px;border:1.5px solid var(--border);border-radius:10px;font-size:.95rem;background:#fafafa;">
        <button class="btn secondary" id="addCatBtn" style="flex:1;">新增分類</button>
      </div>
      <div class="err" id="catErr"></div>
    </div>
  </div>

  <div class="card hidden" id="attendanceCard">
    <h2>參與狀況（<span id="joinedCount">0</span> / <span id="rosterTotal">0</span> 人已加入，<span id="silentCount">0</span> 人還沒發便利貼）</h2>
    <div class="joined-list" id="joinedList"></div>
  </div>

  <div class="card hidden" id="moderationCard">
    <h2>便利貼牆（跟學生看到的一樣，可投影給全班；點便利貼上的 ✕ 可刪除不當內容）</h2>
    <div class="pool-box">
      <div class="pool-title">尚未分類</div>
      <div class="notes-wrap" id="tPool"></div>
    </div>
    <div class="columns" id="tColumns"></div>
  </div>

</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.8.1/firebase-app.js';
import {
  getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged
} from 'https://www.gstatic.com/firebasejs/11.8.1/firebase-auth.js';
import {
  getFirestore, doc, setDoc, updateDoc, getDoc, getDocs, collection, query, where, orderBy, limit,
  writeBatch, onSnapshot, deleteDoc, serverTimestamp
} from 'https://www.gstatic.com/firebasejs/11.8.1/firebase-firestore.js';

const firebaseConfig = {
  apiKey: "AIzaSyDHv5IDqhZfBNAnOECLTx-Wk9khRdLjDTM",
  authDomain: "kj-affinity-board.firebaseapp.com",
  projectId: "kj-affinity-board",
  storageBucket: "kj-affinity-board.firebasestorage.app",
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let uid = null, classId = null, roomId = null;

document.getElementById('loginBtn').addEventListener('click', async () => {
  try { await signInWithPopup(auth, new GoogleAuthProvider()); }
  catch (e) { document.getElementById('loginErr').textContent = e.message; }
});

onAuthStateChanged(auth, async user => {
  if (!user) return;
  uid = user.uid;
  document.getElementById('loginCard').classList.add('hidden');
  document.getElementById('classCard').classList.remove('hidden');
  const snap = await getDocs(query(collection(db, 'classes'), where('teacherId', '==', uid)));
  const sel = document.getElementById('classSelect');
  snap.forEach(d => {
    const opt = document.createElement('option');
    opt.value = d.id; opt.textContent = d.data().name;
    sel.appendChild(opt);
  });
});

document.getElementById('classSelect').addEventListener('change', e => {
  document.getElementById('newClassField').classList.toggle('hidden', !!e.target.value);
});

async function loadRosterIntoTextarea() {
  const rSnap = await getDocs(collection(db, 'classes', classId, 'students'));
  const students = rSnap.docs.map(d => d.data());
  students.sort((a, b) => a.studentNo.localeCompare(b.studentNo, undefined, { numeric: true }));
  document.getElementById('rosterInput').value = students.map(s => s.studentNo + ',' + s.name).join('\n');
  document.getElementById('rosterCount').textContent = '目前已有 ' + students.length + ' 位學生';
}

async function loadTopicList() {
  const listEl = document.getElementById('topicList');
  listEl.innerHTML = '正在讀取…';
  try {
    const snap = await getDocs(query(
      collection(db, 'rooms'), where('classId', '==', classId), where('active', '==', true),
      orderBy('createdAt', 'desc'), limit(20)
    ));
    listEl.innerHTML = '';
    if (snap.empty) {
      listEl.innerHTML = '<p style="color:var(--text-mid);font-size:.85rem;">這個班級還沒開過議題，按下面「開新議題」開始第一個。</p>';
      return;
    }
    snap.forEach(d => {
      const data = d.data();
      const row = document.createElement('div');
      row.className = 'topic-row';
      const dateStr = data.createdAt && data.createdAt.toDate ?
        data.createdAt.toDate().toLocaleString('zh-TW', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '';
      row.innerHTML = '<div><div class="topic-q"></div><div class="topic-meta">' + dateStr + '　代碼 ' + d.id + '</div></div>';
      row.querySelector('.topic-q').textContent = data.question;
      const btn = document.createElement('button');
      btn.className = 'btn secondary';
      btn.textContent = '查看';
      btn.addEventListener('click', () => {
        roomId = d.id;
        openActiveRoom(data.question, data.maxNotesPerStudent || 0);
        document.getElementById('activeRoomCard').scrollIntoView({ behavior: 'smooth' });
      });
      row.appendChild(btn);
      listEl.appendChild(row);
    });
  } catch (e) {
    listEl.innerHTML = '<p style="color:var(--danger);font-size:.85rem;">' + e.message + '</p>';
  }
}

document.getElementById('newTopicToggleBtn').addEventListener('click', () => {
  document.getElementById('roomCard').classList.toggle('hidden');
});

document.getElementById('useClassBtn').addEventListener('click', async () => {
  const sel = document.getElementById('classSelect');
  const errEl = document.getElementById('classErr');
  errEl.textContent = '';
  try {
    if (sel.value) {
      classId = sel.value;
    } else {
      const name = document.getElementById('newClassName').value.trim();
      if (!name) { errEl.textContent = '請輸入班級名稱'; return; }
      const ref = doc(collection(db, 'classes'));
      await setDoc(ref, { name, teacherId: uid, createdAt: serverTimestamp() });
      classId = ref.id;
    }
    document.getElementById('rosterCard').classList.remove('hidden');
    document.getElementById('topicListCard').classList.remove('hidden');
    await loadRosterIntoTextarea();
    await loadTopicList();
  } catch (e) {
    errEl.textContent = e.message;
  }
});

document.getElementById('saveRosterBtn').addEventListener('click', async () => {
  const errEl = document.getElementById('rosterErr');
  errEl.textContent = '';
  const lines = document.getElementById('rosterInput').value.split('\n').map(l => l.trim()).filter(Boolean);
  if (!lines.length) { errEl.textContent = '請至少輸入一位學生'; return; }
  try {
    const batch = writeBatch(db);
    lines.forEach(line => {
      const parts = line.split(/[,，\s]+/).filter(Boolean);
      if (parts.length < 2) return;
      const [studentNo, name] = parts;
      batch.set(doc(db, 'classes', classId, 'students', studentNo), { name, studentNo });
    });
    await batch.commit();
    await loadRosterIntoTextarea();
  } catch (e) {
    errEl.textContent = e.message;
  }
});

function randomCode() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s = '';
  for (let i = 0; i < 6; i++) s += chars[Math.floor(Math.random() * chars.length)];
  return s;
}

document.getElementById('createRoomBtn').addEventListener('click', async () => {
  const errEl = document.getElementById('roomErr');
  errEl.textContent = '';
  const question = document.getElementById('questionInput').value.trim();
  const maxNotes = parseInt(document.getElementById('maxNotesInput').value || '0', 10);
  if (!question) { errEl.textContent = '請輸入議題／問題'; return; }
  try {
    const rosterCheck = await getDocs(collection(db, 'classes', classId, 'students'));
    if (rosterCheck.empty) {
      errEl.textContent = '這個班級還沒有名單，請先在上面「儲存名單」，不然學生會找不到自己的名字';
      return;
    }
    const code = randomCode();
    await setDoc(doc(db, 'rooms', code), {
      classId, question, maxNotesPerStudent: maxNotes, active: true, createdAt: serverTimestamp()
    });
    roomId = code;
    document.getElementById('questionInput').value = '';
    document.getElementById('roomCard').classList.add('hidden');
    openActiveRoom(question, maxNotes);
    loadTopicList();
  } catch (e) {
    errEl.textContent = e.message;
  }
});

function openActiveRoom(question, currentMaxNotes) {
  document.getElementById('activeRoomCard').classList.remove('hidden');
  document.getElementById('attendanceCard').classList.remove('hidden');
  document.getElementById('moderationCard').classList.remove('hidden');
  document.getElementById('activeQuestion').textContent = question;
  document.getElementById('editMaxNotesInput').value = currentMaxNotes;
  const url = location.origin + location.pathname.replace('teacher.html', 'index.html') + '?r=' + roomId;
  document.getElementById('roomLink').textContent = '房間代碼：' + roomId + '　連結：' + url;
  document.getElementById('qrBox').innerHTML = '';
  new QRCode(document.getElementById('qrBox'), { text: url, width: 140, height: 140 });

  onSnapshot(collection(db, 'rooms', roomId, 'categories'), snap => {
    tCategories = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (a.order || 0) - (b.order || 0));
    const list = document.getElementById('catList');
    list.innerHTML = '';
    if (!tCategories.length) {
      const hint = document.createElement('div');
      hint.style.cssText = 'font-size:.82rem;color:var(--text-mid);';
      hint.textContent = '還沒有分類欄位，這是正常的——先讓大家把便利貼發完，等內容夠了再依實際出現的主題新增分類';
      list.appendChild(hint);
    }
    tCategories.forEach(c => {
      const chip = document.createElement('span');
      chip.className = 'cat-chip';
      const label = document.createElement('span');
      label.textContent = c.label;
      const del = document.createElement('button');
      del.textContent = '✕';
      del.setAttribute('aria-label', '刪除分類 ' + c.label);
      del.addEventListener('click', () => deleteDoc(doc(db, 'rooms', roomId, 'categories', c.id)));
      chip.appendChild(label); chip.appendChild(del);
      list.appendChild(chip);
    });
    renderTeacherBoard();
  });

  getDocs(collection(db, 'classes', classId, 'students')).then(rosterSnap => {
    const roster = rosterSnap.docs.map(d => ({ id: d.id, ...d.data() }));
    document.getElementById('rosterTotal').textContent = roster.length;

    onSnapshot(collection(db, 'rooms', roomId, 'joined'), snap => {
      const joinedMap = {};
      snap.forEach(d => { joinedMap[d.id] = d.data(); });
      document.getElementById('joinedCount').textContent = snap.size;

      const rows = roster.map(s => {
        const j = joinedMap[s.id];
        return { name: s.name, studentNo: s.studentNo, joined: !!j, noteCount: j ? (j.noteCount || 0) : 0 };
      });
      rows.sort((a, b) => a.noteCount - b.noteCount || a.studentNo.localeCompare(b.studentNo));
      document.getElementById('silentCount').textContent = rows.filter(r => r.noteCount === 0).length;

      const list = document.getElementById('joinedList');
      list.innerHTML = '';
      rows.forEach(r => {
        const row = document.createElement('div');
        const status = !r.joined ? '尚未加入' : (r.noteCount === 0 ? '已加入，0 則' : r.noteCount + ' 則');
        row.innerHTML = '<span>' + r.name + ' #' + r.studentNo + '</span><span>' + status + '</span>';
        if (r.noteCount === 0) row.style.color = 'var(--danger)';
        list.appendChild(row);
      });
    });
  });

  onSnapshot(collection(db, 'rooms', roomId, 'notes'), snap => {
    tNotes = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderTeacherBoard();
  });
}

let tCategories = [], tNotes = [];
const T_COLORS = ['c0', 'c1', 'c2', 'c3', 'c4'];
let tSelectedNoteId = null;

function tNoteEl(n, idx) {
  const el = document.createElement('div');
  el.className = 'note ' + T_COLORS[idx % T_COLORS.length];
  el.addEventListener('click', ev => {
    ev.stopPropagation();
    if (!tSelectedNoteId) {
      tSelectedNoteId = n.id;
      el.classList.add('selected');
      return;
    }
    if (tSelectedNoteId === n.id) {
      tSelectedNoteId = null;
      el.classList.remove('selected');
      return;
    }
    tGroupWithSelected(n.id);
  });
  const nameRow = document.createElement('div');
  nameRow.className = 'n-name';
  const nameSpan = document.createElement('span');
  nameSpan.textContent = n.name + ' #' + n.studentNo;
  const del = document.createElement('button');
  del.className = 'n-del';
  del.textContent = '✕';
  del.setAttribute('aria-label', '刪除這則便利貼');
  del.addEventListener('click', ev => {
    ev.stopPropagation();
    deleteDoc(doc(db, 'rooms', roomId, 'notes', n.id));
  });
  nameRow.appendChild(nameSpan);
  if (n.groupId) {
    const leave = document.createElement('button');
    leave.className = 'n-del';
    leave.textContent = '↩';
    leave.setAttribute('aria-label', '退出這一群');
    leave.addEventListener('click', ev => {
      ev.stopPropagation();
      updateDoc(doc(db, 'rooms', roomId, 'notes', n.id), { groupId: null });
    });
    nameRow.appendChild(leave);
  }
  nameRow.appendChild(del);
  const textDiv = document.createElement('div');
  textDiv.className = 'n-text';
  textDiv.textContent = n.text;
  el.appendChild(nameRow); el.appendChild(textDiv);
  return el;
}

function renderTeacherBoard() {
  const pool = document.getElementById('tPool');
  const colsWrap = document.getElementById('tColumns');
  if (!pool || !colsWrap) return;
  pool.innerHTML = '';
  colsWrap.innerHTML = '';
  tCategories.forEach(c => {
    const col = document.createElement('div');
    col.className = 'col';
    col.innerHTML = '<div class="col-title">' + c.label + '</div>';
    const colNotes = document.createElement('div');
    colNotes.className = 'col-notes';
    col.appendChild(colNotes);
    col.addEventListener('click', () => tTryMoveSelected(c.id));
    colsWrap.appendChild(col);
  });

  const poolNotes = tNotes.filter(n => !n.categoryId);
  const clusters = {};
  const singles = [];
  poolNotes.forEach(n => {
    if (n.groupId) { (clusters[n.groupId] = clusters[n.groupId] || []).push(n); }
    else { singles.push(n); }
  });

  Object.entries(clusters).forEach(([gid, notes]) => {
    const box = document.createElement('div');
    box.className = 'cluster';
    const notesWrap = document.createElement('div');
    notesWrap.className = 'cluster-notes';
    notes.forEach((n, idx) => notesWrap.appendChild(tNoteEl(n, idx)));
    const nameBtn = document.createElement('button');
    nameBtn.className = 'name-cat-btn';
    nameBtn.textContent = '幫這群命名成分類';
    nameBtn.addEventListener('click', ev => { ev.stopPropagation(); tNameCluster(gid, notes); });
    box.appendChild(notesWrap);
    box.appendChild(nameBtn);
    pool.appendChild(box);
  });

  singles.forEach((n, idx) => pool.appendChild(tNoteEl(n, idx)));

  tNotes.filter(n => n.categoryId).forEach((n, idx) => {
    const target = colsWrap.querySelector('.col:nth-child(' + (tCategories.findIndex(c => c.id === n.categoryId) + 1) + ') .col-notes');
    if (target) target.appendChild(tNoteEl(n, idx));
  });

  pool.onclick = () => tTryMoveSelected(null);
}

async function tGroupWithSelected(targetId) {
  const aId = tSelectedNoteId;
  tSelectedNoteId = null;
  document.querySelectorAll('#moderationCard .note.selected').forEach(x => x.classList.remove('selected'));
  const a = tNotes.find(x => x.id === aId);
  const b = tNotes.find(x => x.id === targetId);
  if (!a || !b) return;
  const gid = a.groupId || b.groupId || ('g' + Date.now());
  const ids = new Set([aId, targetId]);
  if (a.groupId) tNotes.filter(x => x.groupId === a.groupId).forEach(x => ids.add(x.id));
  if (b.groupId) tNotes.filter(x => x.groupId === b.groupId).forEach(x => ids.add(x.id));
  const batch = writeBatch(db);
  ids.forEach(id => batch.update(doc(db, 'rooms', roomId, 'notes', id), { groupId: gid }));
  await batch.commit();
}

async function tNameCluster(gid, notes) {
  const label = prompt('這群便利貼要叫什麼分類名稱？');
  if (!label || !label.trim()) return;
  const catRef = doc(collection(db, 'rooms', roomId, 'categories'));
  const batch = writeBatch(db);
  batch.set(catRef, { label: label.trim(), order: tCategories.length });
  notes.forEach(n => batch.update(doc(db, 'rooms', roomId, 'notes', n.id), { categoryId: catRef.id, groupId: null }));
  await batch.commit();
}

async function tTryMoveSelected(categoryId) {
  if (!tSelectedNoteId) return;
  const id = tSelectedNoteId;
  tSelectedNoteId = null;
  document.querySelectorAll('#moderationCard .note.selected').forEach(x => x.classList.remove('selected'));
  await updateDoc(doc(db, 'rooms', roomId, 'notes', id), { categoryId: categoryId, groupId: null });
}

document.getElementById('addCatBtn').addEventListener('click', async () => {
  const input = document.getElementById('newCatInput');
  const errEl = document.getElementById('catErr');
  errEl.textContent = '';
  const label = input.value.trim();
  if (!label) { errEl.textContent = '請輸入分類名稱'; return; }
  try {
    const existing = await getDocs(collection(db, 'rooms', roomId, 'categories'));
    const nextOrder = existing.size;
    await setDoc(doc(db, 'rooms', roomId, 'categories', 'cat' + Date.now()), { label, order: nextOrder });
    input.value = '';
  } catch (e) {
    errEl.textContent = e.message;
  }
});

document.getElementById('saveMaxNotesBtn').addEventListener('click', async () => {
  const errEl = document.getElementById('maxNotesErr');
  errEl.textContent = '';
  const val = parseInt(document.getElementById('editMaxNotesInput').value || '0', 10);
  try {
    await updateDoc(doc(db, 'rooms', roomId), { maxNotesPerStudent: val });
    errEl.style.color = 'var(--ok)';
    errEl.textContent = '已更新，學生那邊馬上生效';
    setTimeout(() => { errEl.textContent = ''; errEl.style.color = 'var(--danger)'; }, 3000);
  } catch (e) {
    errEl.textContent = e.message;
  }
});
</script>
